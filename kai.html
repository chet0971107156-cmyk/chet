<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
    <h1>Hello! </h1>
    <p id="nickname"></p>
    <p id="programming"></p>
    <p id="games"></p>
    </center>
    <script>
        fetch("http://localhost:3000")
            .then((res) => {
                return res.json()
            })
            .then((data) => {
                document.getElementById("nickname").innerHTML = data.nickname
                document.getElementById("programming").innerHTML = data.programming
                document.getElementById("games").innerHTML = data.games
            })
    
    </script>
</body>
</html>
